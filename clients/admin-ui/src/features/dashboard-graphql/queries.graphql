query DashboardOverview($trendPeriod: TrendPeriod! = thirty_days) {
  posture {
    score
    band
    diffPercent
    diffDirection
    agentAnnotation
    dimensions {
      dimension
      label
      weight
      score
      band
    }
  }
  trends(period: $trendPeriod) {
    period
    metrics {
      key
      value
      history
      metadata
      diff
    }
  }
  systemCoverage {
    totalSystems
    fullyClassified
    partiallyClassified
    unclassified
    withoutSteward
    coveragePercentage
  }
  privacyRequests {
    activeCount
    overdueCount
    statuses {
      inProgress
      pendingAction
      awaitingApproval
    }
    slaHealth {
      label
      onTrack
      approaching
      overdue
    }
  }
  astralis {
    activeConversations
    completedAssessments
    awaitingResponse
    risksIdentified
  }
}

query DashboardAgentBriefing {
  agentBriefing {
    briefing
    quickActions {
      label
      actionType
      severity
      actionData
    }
  }
}

query DashboardPriorityActions(
  $page: Int! = 1
  $size: Int! = 25
  $dimension: String
) {
  priorityActions(page: $page, size: $size, dimension: $dimension) {
    items {
      id
      type
      severity
      title
      message
      agentSummary
      dueDate
      actionData
      status
    }
    total
    page
    size
    pages
  }
}

query DashboardActivityFeed($page: Int! = 1, $size: Int! = 20) {
  activityFeed(page: $page, size: $size) {
    items {
      actorType
      message
      timestamp
    }
    total
    page
    size
    pages
  }
}
